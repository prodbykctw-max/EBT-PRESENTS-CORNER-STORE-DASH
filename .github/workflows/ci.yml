name: CI

on:
  push:
    branches: [main]
  pull_request:

# Deploys don't run here: Cloudflare Workers Builds (connected to this repo, production branch main)
# runs `npx wrangler deploy` on every push to main. See docs/DEPLOYMENT.md.
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Map + gameplay QA
        run: npm run qa
      - name: Leaderboard Worker tests
        run: npm run test:worker
      - name: Upload QA screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-screenshot
          path: qa-screenshot.png
          if-no-files-found: ignore

