name = "ebt-corner-store-dash"
main = "worker/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

# The Worker serves the static game itself, so there is one deploy, one origin,
# and no CORS hop between the game and its leaderboard.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
# "/": the front page goes through the Worker, which serves the full game (standalone). The rest: the drive's big binary files, which the
# Worker answers with their brotli copy (worker/index.js driveBinary). Every other path is served by the assets layer without the Worker.
run_worker_first = ["/", "/drive/*.glb", "/drive/*.bin", "/drive/*.cars", "/drive/*.wav"]

[[d1_databases]]
binding = "DB"
database_name = "ebt-leaderboard"
database_id = "3a2c03b7-8a55-4cce-8b66-b9486219a8f2"

# Per-IP rate limit on POST /api/scores (5 per 60 s). The Worker skips the
# check if this binding is missing.
[[ratelimits]]
name = "SCORE_LIMIT"
namespace_id = "3002"

  [ratelimits.simple]
  limit = 5
  period = 60

[observability]
enabled = true
