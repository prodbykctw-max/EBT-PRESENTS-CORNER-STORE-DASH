<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Drive Test: Auburn Ave</title>
<link rel="stylesheet" href="drive.css" />
<style>
  html, body { margin: 0; height: 100%; background: #101318; color: #fff; font-family: system-ui, sans-serif; }
  #done { position: fixed; inset: 0; display: none; place-items: center; text-align: center; }
  #done h2 { font: 900 34px/1.1 system-ui, sans-serif; letter-spacing: .04em; margin: 0 0 10px; }
  #done p { margin: 0; opacity: .8; font-size: 16px; }
  #done pre { display: none; text-align: left; font-size: 11px; opacity: .7; max-width: 90vw; overflow: auto; }
  #done.qa pre { display: block; }
  #done button { margin-top: 22px; padding: 14px 28px; font: 800 18px system-ui, sans-serif; color: #101318; border-radius: 10px; border: 0; background: #ffd400; }
</style>
</head>
<body>
<!-- Standalone test harness for the drive level. The game loads drive.js the same way (dynamic import). -->
<div id="done"><div><h2 id="dt"></h2><p id="ds"></p><pre id="dr"></pre><button onclick="location.reload()">Drive again</button></div></div>
<script type="module">
  const { startDrive } = await import('./drive.js');
  // ?qa&demo=auburn|arrive: jump to a set piece for screenshots (test harness only)
  const demo = new URLSearchParams(location.search).get('demo');
  if (demo) {
    const wait = setInterval(() => {
      const d = window.__drive; if (!d || d.state !== 'driving') return;
      clearInterval(wait);
      if (demo === 'auburn') Object.assign(d.car, { s: d.spot.s - 330, v: 22 });
      if (demo === 'arrive') Object.assign(d.car, { s: d.spot.s - 1.5, d: d.spot.d, targetD: d.spot.d, v: 0 });
    }, 50);
  }
  // ?qa&bot: the autopilot drives it like a player and logs every hit/error (muted unless &sound)
  const q = new URLSearchParams(location.search), bot = q.has('bot');
  if (bot) import('./autopilot.js').then(({ autopilot }) => {
    const wait = setInterval(() => { const d = window.__drive; if (d && d.car) { clearInterval(wait); autopilot(d); } }, 50);
  });
  await startDrive({
    muted: bot && !q.has('sound'),
    onDone: (r) => {
      done.style.display = 'grid';
      dt.textContent = r.busted ? 'Busted' : r.parked ? (r.cleanPark ? 'Clean park!' : 'Parked') : 'Too late';
      ds.textContent = r.busted ? 'You hit a police car and went to jail.' : r.parked ? `+${r.bonus} bonus · ${r.tokens} EBT · ${r.hits ? r.hits + (r.hits > 1 ? ' hits' : ' hit') : 'no hits'}` : 'The store closed before you got there.';
      if (q.has('qa')) { done.classList.add('qa'); dr.textContent = JSON.stringify(window.__botReport ? { ...r, bot: window.__botReport } : r, null, 1); }   // test report only in QA
    },
  });
</script>
</body>
</html>
